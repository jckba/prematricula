
services:
    postgres:
        image: postgres:17
        container_name: prematricula-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: prematricula
            POSTGRES_USER: prematricula_user
            POSTGRES_PASSWORD: prematricula_local_2026
        ports:
            - "5432:5432"
        volumes:
            - prematricula_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U prematricula_user -d prematricula"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    prematricula_postgres_data:
