  /api/v1/coordinator/academic-periods/{period}/demand:
    get:
      operationId: academicDemand
      summary: Demanda registrada y validada por curso
      tags:
      - Consulta académica y demanda
      description: Solo COORDINADOR activo con autenticación Sanctum. Estimaciones de demanda de prematrícula; no
        constituyen matrícula definitiva. Solo la revisión vigente ENVIO, enviada y no vacía. No cuenta borradores,
        capturas heredadas ni versiones reemplazadas. Un borrador de corrección mantiene el último envío como demanda
        registrada, con ajuste hasta reenviar. Una solicitud REQUIERE_AJUSTE excluye todos sus cursos del subtotal
        valida. Sin validación de esa revisión se informa sin_validacion. Se omiten cursos sin demanda.
      parameters:
      - name: period
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: q
        in: query
        required: false
        schema:
          type: string
          minLength: 2
          maxLength: 150
        description: Coincidencia parcial literal, sin distinguir mayúsculas, en código o nombre del curso.
      - name: ciclo
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 32767
      - name: course_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: estado_validacion
        in: query
        required: false
        schema:
          type: string
          enum:
          - VALIDA
          - PENDIENTE_RESULTADOS
          - REQUIERE_AJUSTE
          - SIN_VALIDACION
      - name: preferencia_turno
        in: query
        required: false
        schema:
          type: string
          enum:
          - MANANA
          - TARDE
          - SIN_PREFERENCIA
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - course_id
          - codigo
          - nombre
          - ciclo
          - creditos
          - registrada
          - valida
          - pendiente_resultados
          - requiere_ajuste
          default: course_id
      - name: direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      academic_period_id:
                        type: integer
                        minimum: 0
                      advertencia:
                        type: string
                      cursos:
                        type: array
                        items:
                          $ref: '#/components/schemas/AcademicCourseDemand'
                      paginacion:
                        $ref: '#/components/schemas/AcademicPagination'
        '401':
          $ref: '#/components/responses/Unauthenticated'
