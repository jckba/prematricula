components:
  parameters:
    CourseId:
      name: course
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    Teacher:
      type: object
      properties:
        codigo_institucional:
          type: string
          maxLength: 30
        nombres:
          type: string
          maxLength: 100
        apellidos:
          type: string
          maxLength: 150
        correo_institucional:
          type:
          - string
          - 'null'
          format: email
          maxLength: 255
        estado:
          type: string
          enum:
          - ACTIVO
          - INACTIVO
          default: ACTIVO
        max_horas_semanales:
          anyOf:
          - type: string
            pattern: ^\d+\.\d{2}$
            examples:
            - '1.50'
          - type: 'null'
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TeachingAssignment:
      type: object
      properties:
        id:
          type: integer
        academic_period_id:
          type: integer
        course_id:
          type: integer
        teacher_id:
          type: integer
        docente:
          $ref: '#/components/schemas/Teacher'
        curso:
          type: object
          properties:
            id:
              type: integer
            codigo:
              type: string
            nombre:
              type: string
        horas_teoria_asignadas:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        horas_practica_asignadas:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        horas_laboratorio_asignadas:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        total_semanal:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        created_by:
          type: integer
        updated_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TeachingAssignmentChange:
      type: object
      properties:
        id:
          type: integer
        teaching_assignment_id:
          type: integer
        actor_id:
          type: integer
        accion:
          type: string
          enum:
          - CREADA
          - ACTUALIZADA
          - ELIMINADA
        before:
          type:
          - object
          - 'null'
        after:
          type: object
        created_at:
          type: string
          format: date-time
    TeacherLoad:
      type: object
      properties:
        docente:
          $ref: '#/components/schemas/Teacher'
        cantidad_cursos:
          type: integer
          minimum: 0
        horas_teoria_asignadas:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        horas_practica_asignadas:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        horas_laboratorio_asignadas:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        total_semanal:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        excede_limite:
          type: boolean
        horas_disponibles:
          anyOf:
          - type: string
            pattern: ^\d+\.\d{2}$
            examples:
            - '1.50'
          - type: 'null'
    CourseTeachingLoad:
      type: object
      properties:
        course_id:
          type: integer
        codigo:
          type: string
        nombre:
          type: string
        ciclo:
          type: integer
        estado:
          type: string
          enum:
          - ACTIVO
          - INACTIVO
        cantidad_docentes:
          type: integer
          minimum: 0
        horas_teoria_asignadas:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        horas_practica_asignadas:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        horas_laboratorio_asignadas:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        total_semanal:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        horas_teoria:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        horas_teoria_pendientes:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        horas_practica:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        horas_practica_pendientes:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        horas_laboratorio:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        horas_laboratorio_pendientes:
          type: string
          pattern: ^\d+\.\d{2}$
          examples:
          - '1.50'
        demanda_registrada:
          type: integer
          minimum: 0
        demanda_valida:
          type: integer
          minimum: 0
        demanda_pendiente_resultados:
          type: integer
          minimum: 0
        demanda_requiere_ajuste:
          type: integer
          minimum: 0
        demanda_sin_validacion:
          type: integer
          minimum: 0
      description: Una unidad docente por curso/período. La demanda se conserva separada de las horas y nunca genera
        grupos.
    TeachingLoadContext:
      type: object
      properties:
        academic_period_id:
          type: integer
        advertencia:
          type: string
          description: No representa grupos paralelos, turnos, horarios ni conflictos de tiempo.
        advertencia_demanda:
          type: string
          description: Estimaciones de prematrícula; no matrícula definitiva.
    TeachingLoadSummary:
      type: object
      properties:
        academic_period_id:
          type: integer
        advertencia:
          type: string
          description: No representa grupos paralelos, turnos, horarios ni conflictos de tiempo.
        advertencia_demanda:
          type: string
          description: Estimaciones de prematrícula; no matrícula definitiva.
        totales:
          type: object
          properties:
            asignaciones:
              type: integer
            docentes_con_carga:
              type: integer
            cursos_con_asignacion:
              type: integer
            cursos_sin_asignacion:
              type: integer
            docentes_exceden_limite:
              type: integer
            horas_teoria_asignadas:
              type: string
              pattern: ^\d+\.\d{2}$
              examples:
              - '1.50'
            horas_practica_asignadas:
              type: string
              pattern: ^\d+\.\d{2}$
              examples:
              - '1.50'
