openapi: 3.1.0
info:
  title: Prematrícula - catálogo, períodos e historial académico
  version: 1.3.0
  description: >-
    Sanctum y una sola malla vigente, sin versiones de planes. La gestión de
    cuentas se describe en API.md y la política de cursos en ../docs/curriculum.md.
security:
  - bearerAuth: []
paths:
  /api/v1/login:
    post:
      operationId: login
      summary: Login con correo institucional o código universitario
      security: []
      description: >-
        Enviar identifier o el alias temporal correo_institucional, nunca ambos.
        El código se envía como string y se resuelve mediante Student -> User.
        Credenciales incorrectas, identificadores ambiguos, usuarios inactivos
        y estudiantes sin perfil activo reciben el mismo 401.
        Límites por minuto: 5 por identificador/IP y 30 por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/LoginRequest'
                - $ref: '#/components/schemas/LegacyLoginRequest'
            examples:
              email:
                value: {identifier: estudiante@unitru.edu.pe, password: password}
              code:
                value: {identifier: '0014527007', password: password}
              legacy:
                value: {correo_institucional: estudiante@unitru.edu.pe, password: password}
      responses:
        '200':
          description: Token e identidad pública
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message:
                    type: string
                    const: Autenticación correcta.
                  data:
                    type: object
                    required: [token, expires_at, user]
                    properties:
                      token:
                        type: string
                        description: Se entrega una sola vez. No registrar en logs.
                      expires_at:
                        type: string
                        format: date-time
                        description: Vencimiento a las ocho horas.
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: Credenciales incorrectas, sin revelar existencia o estado de la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example: {message: Credenciales incorrectas.}
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Límite de peticiones excedido
          headers:
            Retry-After:
              description: Segundos antes de reintentar
              schema: {type: integer}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          $ref: '#/components/responses/DatabaseError'
  /api/v1/me:
    get:
      operationId: currentUser
      summary: Consultar identidad autenticada
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identidad del usuario activo
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DisabledAccount'
        '500':
          $ref: '#/components/responses/DatabaseError'
  /api/v1/logout:
    post:
      operationId: logout
      summary: Revocar únicamente el token actual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token eliminado; no puede reutilizarse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example: {message: Sesión cerrada correctamente.}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/DisabledAccount'
        '500':
          $ref: '#/components/responses/DatabaseError'
  /api/v1/courses:
    get:
      operationId: listCourses
      summary: Catálogo paginado; estudiantes solo ven cursos activos
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
          description: Búsqueda literal de código o nombre; sin comodines.
        - name: ciclo
          in: query
          schema: {type: integer, minimum: 1, maximum: 32767}
          description: Filtro de catálogo, no límite de elegibilidad.
        - name: estado
          in: query
          schema: {type: string, enum: [ACTIVO, INACTIVO]}
          description: Estudiantes no pueden solicitar INACTIVO (403).
        - name: per_page
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
      responses:
        '200':
          description: Cursos ordenados por ciclo, código e ID
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Course'}
                  links:
                    type: object
                    properties:
                      first: {type: string, format: uri}
                      last: {type: string, format: uri}
                      prev: {type: [string, 'null'], format: uri}
                      next: {type: [string, 'null'], format: uri}
                  meta:
                    type: object
                    properties:
                      current_page: {type: integer}
                      last_page: {type: integer}
                      per_page: {type: integer}
                      total: {type: integer}
                      from: {type: [integer, 'null']}
                      to: {type: [integer, 'null']}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/DatabaseError'}
  /api/v1/courses/{course}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      operationId: showCourse
      summary: Curso por ID y sus prerrequisitos
      responses:
        '200': {$ref: '#/components/responses/CourseResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/DisabledAccount'}
        '404': {$ref: '#/components/responses/CourseNotFound'}
        '500': {$ref: '#/components/responses/DatabaseError'}
  /api/v1/coordinator/courses/{course}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    patch:
      operationId: updateCourse
      summary: Modificar datos permitidos; exclusivo para coordinadores
      description: >-
        Cursos utilizados en historial o cualquier prematrícula, incluso borrador,
        conservan todos los datos académicos y prerrequisitos; solo pueden cambiar
        estado. Códigos no se renombran. Cambios del grafo se validan bajo bloqueo
        transaccional. Errores de dominio usan CurriculumReport con row 0.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CourseUpdate'}
            example: {horas_teoria: '2.50', prerrequisitos: ['00101', FIS101]}
      responses:
        '200': {$ref: '#/components/responses/CourseResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/CourseNotFound'}
        '422': {$ref: '#/components/responses/CurriculumError'}
        '500': {$ref: '#/components/responses/DatabaseError'}
  /api/v1/coordinator/curriculum/template:
    get:
      operationId: curriculumTemplate
      summary: Descargar plantilla XLSX; exclusivo para coordinadores
      description: >-
        Una hoja visible y ocho encabezados obligatorios: codigo, nombre, creditos,
        ciclo, horas_teoria, horas_practica, horas_laboratorio, prerrequisitos.
      responses:
        '200': {$ref: '#/components/responses/XlsxDownload'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/coordinator/curriculum/validate:
    post:
      operationId: validateCurriculum
      summary: Validar XLSX sin persistir; exclusivo para coordinadores
      description: >-
        Valida filas, referencias independientes del orden, autorreferencias,
        ciclos y protección histórica. Máximo 5000 filas de datos, 5 MiB de
        archivo y 20 MiB descomprimidos. No admite fórmulas ni contenido activo.
        Los errores de datos indican número físico de fila y nombre de columna.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {$ref: '#/components/schemas/CurriculumFile'}
      responses:
        '200':
          description: Informe válido, SHA-256 del archivo y huella base del catálogo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurriculumReportResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/CurriculumError'}
        '500': {$ref: '#/components/responses/DatabaseError'}
  /api/v1/coordinator/curriculum/import:
    post:
      operationId: importCurriculum
      summary: Confirmar importación transaccional; exclusivo para coordinadores
      description: >-
        Enviar el mismo archivo y hashes obtenidos en validate. Se revalida bajo
        bloqueo PostgreSQL antes de escribir. Idempotente por código y conjunto
        de prerrequisitos; un reenvío ya aplicado es un no-op, aun con huella base
        anterior. No elimina cursos omitidos ni cambia estados existentes.
        El informe conserva la huella base de la operación, no la resultante.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, sha256, catalog_fingerprint]
              properties:
                file: {$ref: '#/components/schemas/CurriculumFile'}
                sha256: {$ref: '#/components/schemas/Sha256'}
                catalog_fingerprint: {$ref: '#/components/schemas/Sha256'}
      responses:
        '200':
          description: Cursos y relaciones confirmados juntos, o reimportación sin cambios
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CurriculumReportResponse'
                  - type: object
                    required: [message]
                    properties:
                      message: {type: string, const: Malla curricular importada correctamente.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Archivo distinto del validado o catálogo cambiado con modificaciones pendientes; volver a validar
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '422': {$ref: '#/components/responses/CurriculumError'}
        '500': {$ref: '#/components/responses/DatabaseError'}
  /api/v1/coordinator/curriculum/export:
    get:
      operationId: exportCurriculum
      summary: Exportar malla XLSX; exclusivo para coordinadores
      description: >-
        Todos los cursos, activos e inactivos, ordenados por código, en las ocho
        columnas obligatorias. No incluye estado. Prerrequisitos separados por ;.
        Códigos y nombres se exportan como texto literal, conservando ceros iniciales.
      responses:
        '200': {$ref: '#/components/responses/XlsxDownload'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/DatabaseError'}
  "/api/v1/academic-periods":
    get:
      operationId: "listAcademicPeriods"
      summary: "Consultar períodos con ventanas; usuario activo"
      responses:
        200:
          description: "Respuesta correcta"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["data"]
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/AcademicPeriod"
                  links:
                    type: "object"
                  meta:
                    type: "object"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        422:
          $ref: "#/components/responses/ValidationError"
  "/api/v1/academic-periods/{period}":
    parameters:
      -
        name: "period"
        in: "path"
        required: true
        schema:
          type: "integer"
          minimum: 1
    get:
      operationId: "showAcademicPeriod"
      summary: "Consultar un período por ID"
      responses:
        200:
          description: "Respuesta correcta"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["data"]
                properties:
                  data:
                    $ref: "#/components/schemas/AcademicPeriod"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          description: "Período inexistente"
        422:
          $ref: "#/components/responses/ValidationError"
  "/api/v1/academic-periods/{period}/windows":
    parameters:
      -
        name: "period"
        in: "path"
        required: true
        schema:
          type: "integer"
          minimum: 1
    get:
      operationId: "listPreEnrollmentWindows"
      summary: "Ventanas históricas del período; usuario activo"
      responses:
        200:
          description: "Respuesta correcta"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["data"]
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/PreEnrollmentWindow"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        422:
          $ref: "#/components/responses/ValidationError"
  "/api/v1/coordinator/academic-periods":
    post:
      operationId: "createAcademicPeriod"
      summary: "Crear período; coordinador"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AcademicPeriodInput"
              required: ["codigo","fecha_inicio","fecha_fin","estado"]
      responses:
        201:
          description: "Respuesta correcta"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["data"]
                properties:
                  data:
                    $ref: "#/components/schemas/AcademicPeriod"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        422:
          $ref: "#/components/responses/ValidationError"
  "/api/v1/coordinator/academic-periods/{period}":
    parameters:
      -
        name: "period"
        in: "path"
        required: true
        schema:
          type: "integer"
          minimum: 1
    patch:
      operationId: "updateAcademicPeriod"
      summary: "Administrar período; coordinador"
      description: "Código y fechas de clases son inmutables si hay historial o solicitudes. No escribe las fechas heredadas de prematrícula. Registra updated_by."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AcademicPeriodInput"
      responses:
        200:
          description: "Respuesta correcta"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["data"]
                properties:
                  data:
                    $ref: "#/components/schemas/AcademicPeriod"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        422:
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: "deleteAcademicPeriod"
      summary: "Eliminar solo un período sin referencias; coordinador"
      responses:
        200:
          description: "Respuesta correcta"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Message"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        409:
          description: "El período tiene ventanas, historial o solicitudes"
        422:
          $ref: "#/components/responses/ValidationError"
  "/api/v1/coordinator/academic-periods/{period}/windows":
    parameters:
      -
        name: "period"
        in: "path"
        required: true
        schema:
          type: "integer"
          minimum: 1
    post:
      operationId: "createPreEnrollmentWindow"
      summary: "Crear ordinaria o reapertura extraordinaria GLOBAL; coordinador"
      description: "Intervalos [inicio, fin). Una ordinaria y posteriores extraordinarias sin solapamientos. No hay edición, borrado ni permisos individuales. Motivo y autor quedan registrados."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PreEnrollmentWindowInput"
      responses:
        201:
          description: "Respuesta correcta"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["data"]
                properties:
                  data:
                    $ref: "#/components/schemas/PreEnrollmentWindow"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        422:
          $ref: "#/components/responses/ValidationError"
  "/api/v1/coordinator/academic-periods/{period}/demand":
    parameters:
      -
        name: "period"
        in: "path"
        required: true
        schema:
          type: "integer"
          minimum: 1
    get:
      operationId: "academicDemand"
      summary: "Demanda por curso según validación académica; coordinador"
      description: "Cuenta selecciones VALIDA del último envío registrado. Un borrador de corrección no reemplaza la revisión vigente hasta reenviarse; pendientes y ajustes se informan por separado."
      responses:
        200:
          description: "Respuesta correcta"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["data"]
                properties:
                  data:
                    type: "object"
                    properties:
                      academic_period_id:
                        type: "integer"
                      cursos:
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            course_id:
                              type: "integer"
                            codigo:
                              type: "string"
                            valida:
                              type: "integer"
                            pendiente_resultados:
                              type: "integer"
                            requiere_ajuste:
                              type: "integer"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        422:
          $ref: "#/components/responses/ValidationError"
  "/api/v1/student/academic-history":
    get:
      operationId: "ownAcademicHistory"
      summary: "Historial propio, sin posibilidad de escritura"
      description: "student_id no cambia al propietario autenticado."
      parameters:
        -
          name: "academic_period_id"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
      responses:
        200:
          description: "Respuesta correcta"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["data"]
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/AcademicHistory"
                  links:
                    type: "object"
                  meta:
                    type: "object"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        422:
          $ref: "#/components/responses/ValidationError"
  "/api/v1/coordinator/academic-history":
    get:
      operationId: "listAcademicHistory"
      summary: "Consultar resultados oficiales; coordinador"
      parameters:
        -
          name: "student_id"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
        -
          name: "academic_period_id"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
      responses:
        200:
          description: "Respuesta correcta"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["data"]
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/AcademicHistory"
                  links:
                    type: "object"
                  meta:
                    type: "object"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        422:
          $ref: "#/components/responses/ValidationError"
  "/api/v1/coordinator/academic-history/template":
    get:
      operationId: "academicHistoryTemplate"
      summary: "Plantilla XLSX de resultados; coordinador"
      responses:
        200:
          $ref: "#/components/responses/XlsxDownload"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        422:
          $ref: "#/components/responses/ValidationError"
  "/api/v1/coordinator/academic-history/validate":
    post:
      operationId: "validateAcademicHistory"
      summary: "Validación previa XLSX sin persistencia; coordinador"
      description: "Columnas codigo_universitario, codigo_curso, codigo_periodo, nota_final, estado. No se infiere aprobación por nota. Errores con fila física y columna. Límites del lector XLSX del catálogo."
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: "object"
              required: ["file"]
              properties:
                file:
                  $ref: "#/components/schemas/CurriculumFile"
      responses:
        200:
          description: "Respuesta correcta"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["data"]
                properties:
                  data:
                    $ref: "#/components/schemas/AcademicHistoryReport"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        422:
          $ref: "#/components/responses/AcademicHistoryError"
  "/api/v1/coordinator/academic-history/import":
    post:
      operationId: "importAcademicHistory"
      summary: "Confirmación transaccional y auditada; coordinador"
      description: "Mismo file, sha256 e history_fingerprint de validate. Motivo obligatorio. Actualiza por alumno/curso/período. Revalida solicitudes vigentes en la misma transacción sin modificar ENVIADA ni ventanas. Reenvíos ya aplicados no duplican resultados; cada confirmación conserva lote de auditoría."
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: "object"
              required: ["file","sha256","history_fingerprint","motivo"]
              properties:
                file:
                  $ref: "#/components/schemas/CurriculumFile"
                sha256:
                  $ref: "#/components/schemas/Sha256"
                history_fingerprint:
                  $ref: "#/components/schemas/Sha256"
                motivo:
                  type: "string"
                  minLength: 1
                  maxLength: 2000
      responses:
        200:
          description: "Respuesta correcta"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["data"]
                properties:
                  data:
                    $ref: "#/components/schemas/AcademicHistoryReport"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        409:
          description: "Archivo distinto o historial modificado; volver a validar"
        422:
          $ref: "#/components/responses/AcademicHistoryError"
        500:
          $ref: "#/components/responses/DatabaseError"
  "/api/v1/coordinator/academic-history/imports":
    get:
      operationId: "listAcademicHistoryImports"
      summary: "Lotes de auditoría; coordinador"
      responses:
        200:
          description: "Respuesta correcta"
          content:
            "application/json":
              schema:
                type: "object"
                required: ["data"]
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/AcademicHistoryImport"
                  links:
                    type: "object"
                  meta:
                    type: "object"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        422:
          $ref: "#/components/responses/ValidationError"
  "/api/v1/coordinator/academic-history/imports/{import}":
    parameters:
      -
        name: "import"
        in: "path"
        required: true
        schema:
