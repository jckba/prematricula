                $ref: '#/components/schemas/Course'
    CourseNotFound:
      description: Curso inexistente o inactivo consultado por un estudiante
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Forbidden:
      description: Rol o política no autorizados, o cuenta desactivada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    CurriculumError:
      description: Error de datos, grafo o protección con informe localizado por fila/columna; errores de carga,
        contenedor, encabezados o campos JSON usan message/errors.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/CurriculumReportResponse'
            - type: object
              required:
              - message
              - errors
              properties:
                message:
                  type: string
                errors:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
    XlsxDownload:
      description: Hoja Excel con ocho encabezados; descarga privada, no-store
      headers:
        Content-Disposition:
          schema:
            type: string
          description: attachment con nombre de archivo .xlsx
        Cache-Control:
          schema:
            type: string
            const: private, no-store
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    Unauthenticated:
      description: Token ausente, inválido, revocado o vencido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Unauthenticated.
    DisabledAccount:
      description: Cuenta desactivada o estudiante sin perfil activo; se revocan sus tokens
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Acceso no autorizado.
    ValidationError:
      description: Datos inválidos; en login incluye ambos campos de identificación presentes
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            - errors
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    DatabaseError:
      description: Error de persistencia sin detalles sensibles
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: No se pudo completar la operación.
