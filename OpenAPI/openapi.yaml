components:
  parameters:
    CourseId:
      name: course
      in: path
      required: true
      schema: {type: integer, minimum: 1}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    PreEnrollmentRevision:
      type: "object"
      properties:
        id:
          type: "integer"
        revision_number:
          type: ["integer","null"]
        window_id:
          type: ["integer","null"]
        submitted_at:
          type: ["string","null"]
          format: "date-time"
        receipt_code:
          type: ["string","null"]
        receipt_available:
          type: "boolean"
        pdf_sha256:
          type: ["string","null"]
        schema_version:
          type: "integer"
        motivo:
          type: "string"
        snapshot:
          type: "object"
          description: "Datos históricos inmutables: institución, estudiante, período, cursos completos, créditos, preferencias, fecha y ventana. Schema 1 puede estar incompleto; no se fabrica PDF."
    AcademicPeriodInput:
      type: "object"
      properties:
        codigo:
          type: "string"
          maxLength: 20
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        fecha_inicio:
          type: "string"
          format: "date"
        fecha_fin:
          type: "string"
          format: "date"
        estado:
          type: "string"
          enum: ["PLANIFICACION","PREMATRICULA","EN_CURSO","CERRADO"]
      description: "No aceptar autor ni fechas heredadas; las fechas de clases son independientes de ventanas."
    AcademicPeriod:
      type: "object"
      required: ["id","codigo","estado","fecha_inicio","fecha_fin","created_by","updated_by","ventanas"]
      properties:
        id:
          type: "integer"
        codigo:
          type: "string"
        estado:
          type: "string"
        fecha_inicio:
          type: "string"
          format: "date"
        fecha_fin:
          type: "string"
          format: "date"
        timezone:
          type: "string"
        created_by:
          type: ["integer","null"]
        updated_by:
          type: ["integer","null"]
        created_at:
          type: "string"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
        ventanas:
          type: "array"
          items:
            $ref: "#/components/schemas/PreEnrollmentWindow"
    PreEnrollmentWindowInput:
      type: "object"
      required: ["tipo","fecha_inicio","fecha_fin","motivo"]
      properties:
        tipo:
          type: "string"
          enum: ["ORDINARIA","EXTRAORDINARIA"]
        fecha_inicio:
          type: "string"
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$"
        fecha_fin:
          type: "string"
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$"
        motivo:
          type: "string"
          minLength: 1
          maxLength: 2000
      description: "Fechas locales en ACADEMIC_TIMEZONE, por defecto America/Lima. No recibir student_id, user_id ni created_by."
    PreEnrollmentWindow:
      type: "object"
      properties:
        id:
          type: "integer"
        academic_period_id:
          type: "integer"
        tipo:
          type: "string"
          enum: ["ORDINARIA","EXTRAORDINARIA"]
        fecha_inicio:
          type: "string"
          format: "date-time"
        fecha_fin:
          type: "string"
          format: "date-time"
        timezone:
          type: "string"
        motivo:
          type: "string"
        created_by:
          type: ["integer","null"]
        origen:
          type: "string"
          enum: ["API","MIGRACION"]
        created_at:
          type: "string"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
    AcademicHistory:
      type: "object"
      properties:
        id:
          type: "integer"
        student_id:
          type: "integer"
        codigo_universitario:
          type: "string"
        curso:
          type: "object"
          properties:
            id:
              type: "integer"
            codigo:
              type: "string"
            nombre:
              type: "string"
        periodo:
          type: "object"
          properties:
            id:
              type: "integer"
            codigo:
              type: "string"
        nota_final:
          type: ["string","null"]
          description: "Decimal de dos posiciones. Sin nota mínima aprobatoria; estado oficial manda."
        estado:
          type: "string"
          enum: ["APROBADO","DESAPROBADO","RETIRADO","EN_CURSO"]
        created_at:
          type: "string"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
    AcademicHistoryReport:
      type: "object"
      required: ["valid","history_fingerprint","summary","changes","errors"]
      properties:
        valid:
          type: "boolean"
        history_fingerprint:
          $ref: "#/components/schemas/Sha256"
          description: "Huella base de los resultados y referencias afectados."
        sha256:
          $ref: "#/components/schemas/Sha256"
        import_id:
          type: "integer"
        summary:
          type: "object"
          properties:
            created:
              type: "integer"
            updated:
              type: "integer"
            unchanged:
              type: "integer"
        changes:
          type: "array"
          items:
            type: "object"
            properties:
              row:
                type: "integer"
              codigo_universitario:
                type: "string"
              codigo_curso:
                type: "string"
              codigo_periodo:
                type: "string"
              action:
                type: "string"
                enum: ["create","update","unchanged"]
              before:
                type: ["object","null"]
              after:
                type: "object"
        errors:
          type: "array"
          items:
            type: "object"
            required: ["row","column","message"]
            properties:
              row:
                type: "integer"
                minimum: 1
              column:
                type: "string"
              message:
                type: "string"
    AcademicHistoryImport:
      type: "object"
      properties:
        id:
          type: "integer"
        created_by:
          type: "integer"
        sha256:
          $ref: "#/components/schemas/Sha256"
        motivo:
          type: "string"
        summary:
          type: "object"
        created_at:
          type: "string"
          format: "date-time"
        changes:
          type: "array"
          items:
            type: "object"
            properties:
              id:
                type: "integer"
              academic_history_id:
                type: "integer"
              before:
                type: ["object","null"]
              after:
                type: "object"
              created_at:
                type: "string"
                format: "date-time"
    AcademicValidation:
      type: ["object","null"]
      properties:
        estado:
          type: "string"
          enum: ["PENDIENTE_RESULTADOS","VALIDA","REQUIERE_AJUSTE"]
        evaluated_at:
          type: "string"
          format: "date-time"
        cursos:
          type: "array"
          items:
            type: "object"
            properties:
              course_id:
                type: "integer"
              codigo:
                type: "string"
              estado:
                type: "string"
                enum: ["PENDIENTE_RESULTADOS","VALIDA","REQUIERE_AJUSTE"]
              motivo:
                type: ["string","null"]
              prerrequisitos:
                type: "array"
                items:
                  type: "object"
                  properties:
                    id:
                      type: "integer"
                    codigo:
                      type: "string"
                    estado_historial:
                      type: ["string","null"]
                      enum: ["APROBADO","DESAPROBADO","RETIRADO","EN_CURSO",null]
                    estado_validacion:
                      type: "string"
    PreEnrollmentProcessFields:
      type: "object"
      description: "Campos del recurso de prematrícula existente; conserva los demás datos públicos."
      properties:
        id:
          type: "integer"
        estado:
          type: "string"
          enum: [BORRADOR, ENVIADA, APROBADA, RECHAZADA]
          description: Los dos últimos estados son exclusivamente históricos; ENVIADA es registro exitoso.
        fecha_envio:
          type: [string, 'null']
          format: "date-time"
        correccion_en_progreso:
          type: "boolean"
        current_revision_id:
          type: [integer, 'null']
        revision_vigente:
          oneOf:
            - $ref: '#/components/schemas/PreEnrollmentRevision'
            - type: 'null'
        validacion_academica:
          $ref: "#/components/schemas/AcademicValidation"
    Sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
      minLength: 64
      maxLength: 64
    CurriculumFile:
      type: string
      format: binary
      description: Archivo .xlsx, máximo 5120 KiB; una sola hoja visible.
    WeeklyHours:
      type: string
      pattern: '^[0-9]{1,3}\.[0-9]{2}$'
      description: Horas académicas semanales decimal(5,2), no totales del semestre; rango 0 a 999.99.
      examples: ['0.00', '2.50']
    WeeklyHoursInput:
      oneOf:
        - type: number
          minimum: 0
          maximum: 999.99
          multipleOf: 0.01
        - type: string
          pattern: '^[0-9]{1,3}(\.[0-9]{1,2})?$'
      description: Número o texto decimal; máximo dos posiciones decimales.
    Course:
      type: object
      required: [id, codigo, nombre, creditos, ciclo, horas_teoria, horas_practica, horas_laboratorio, estado, prerrequisitos]
      properties:
        id: {type: integer}
        codigo: {type: string, maxLength: 30, examples: ['00101']}
        nombre: {type: string, maxLength: 150}
        creditos: {type: integer, minimum: 1, maximum: 32767}
        ciclo: {type: integer, minimum: 1, maximum: 32767}
        horas_teoria: {$ref: '#/components/schemas/WeeklyHours'}
        horas_practica: {$ref: '#/components/schemas/WeeklyHours'}
        horas_laboratorio: {$ref: '#/components/schemas/WeeklyHours'}
        estado: {type: string, enum: [ACTIVO, INACTIVO]}
        prerrequisitos:
          type: array
          items:
            type: object
            required: [id, codigo, nombre]
            properties:
              id: {type: integer}
              codigo: {type: string}
              nombre: {type: string}
    CourseUpdate:
      type: object
      properties:
        nombre: {type: string, minLength: 1, maxLength: 150}
        creditos: {type: integer, minimum: 1, maximum: 32767}
        ciclo: {type: integer, minimum: 1, maximum: 32767}
        horas_teoria: {$ref: '#/components/schemas/WeeklyHoursInput'}
        horas_practica: {$ref: '#/components/schemas/WeeklyHoursInput'}
        horas_laboratorio: {$ref: '#/components/schemas/WeeklyHoursInput'}
        estado: {type: string, enum: [ACTIVO, INACTIVO]}
        prerrequisitos:
          type: array
          maxItems: 5000
          uniqueItems: true
          items:
            type: string
            maxLength: 30
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
      not:
        required: [codigo]
    CurriculumReportResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/CurriculumReport'}
    CurriculumReport:
      type: object
      required: [valid, catalog_fingerprint, summary, changes, errors]
      properties:
        valid: {type: boolean}
        catalog_fingerprint:
          allOf:
            - $ref: '#/components/schemas/Sha256'
          description: Huella del catálogo base, incluyendo prerrequisitos, estado y uso académico.
        sha256:
          allOf:
            - $ref: '#/components/schemas/Sha256'
          description: Archivo recibido; presente en validación y confirmación exitosa.
        summary:
          type: object
          required: [created, updated, unchanged]
          properties:
            created: {type: integer, minimum: 0}
            updated: {type: integer, minimum: 0}
            unchanged: {type: integer, minimum: 0}
        changes:
          type: array
          items:
            type: object
            required: [row, codigo, action, fields, protected]
            properties:
              row: {type: integer, minimum: 0}
              codigo: {type: string}
              action: {type: string, enum: [create, update, unchanged]}
              fields:
                type: array
                items: {type: string}
              protected: {type: boolean}
        errors:
          type: array
          items:
            type: object
            required: [row, column, message]
            properties:
              row:
                type: integer
                minimum: 0
                description: Fila física Excel; 1 para error global del grafo, 0 para PATCH sin Excel.
              column: {type: string}
              message: {type: string}
    LoginRequest:
      type: object
      required: [identifier, password]
      not:
        required: [correo_institucional]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 255
          description: Correo institucional o código universitario como texto.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          writeOnly: true
    LegacyLoginRequest:
      type: object
      required: [correo_institucional, password]
      not:
        required: [identifier]
      properties:
        correo_institucional:
          type: string
          format: email
          maxLength: 255
          deprecated: true
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          writeOnly: true
    User:
      type: object
      additionalProperties: false
      required: [id, correo_institucional, rol, estado, cargo]
      properties:
        id:
          type: integer
        correo_institucional:
          type: string
          format: email
        rol:
          type: string
          enum: [ESTUDIANTE, COORDINADOR]
        estado:
          type: string
          enum: [ACTIVO, INACTIVO]
        cargo:
          type: [string, 'null']
          enum: [DIRECTOR_ESCUELA, SECRETARIA, null]
          description: Nulo para estudiantes y coordinadores anteriores sin cargo confirmado.
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
  responses:
    PreEnrollmentPdf:
      description: "Una página A4; bytes originales verificados por SHA-256, snapshot completo del envío. No constituye matrícula definitiva."
      headers:
        "Content-Disposition":
          schema:
            type: "string"
        "Cache-Control":
          schema:
            type: "string"
            const: "private, no-store"
      content:
        "application/pdf":
          schema:
            type: "string"
            format: "binary"
    AcademicHistoryError:
      description: "Errores de datos por fila/columna o validación de carga/campos."
      content:
        "application/json":
          schema:
            oneOf:
              -
                type: "object"
                required: ["data"]
                properties:
                  data:
                    $ref: "#/components/schemas/AcademicHistoryReport"
              -
                type: "object"
                required: ["message","errors"]
                properties:
                  message:
                    type: "string"
                  errors:
                    type: "object"
    CourseResponse:
      description: Curso con horas semanales y prerrequisitos
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/Course'}
    CourseNotFound:
      description: Curso inexistente o inactivo consultado por un estudiante
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Message'}
    Forbidden:
      description: Rol o política no autorizados, o cuenta desactivada
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Message'}
    CurriculumError:
      description: >-
        Error de datos, grafo o protección con informe localizado por fila/columna;
        errores de carga, contenedor, encabezados o campos JSON usan message/errors.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/CurriculumReportResponse'
              - type: object
                required: [message, errors]
                properties:
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: {type: string}
    XlsxDownload:
      description: Hoja Excel con ocho encabezados; descarga privada, no-store
      headers:
        Content-Disposition:
          schema: {type: string}
          description: attachment con nombre de archivo .xlsx
        Cache-Control:
          schema: {type: string, const: 'private, no-store'}
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: {type: string, format: binary}
    Unauthenticated:
      description: Token ausente, inválido, revocado o vencido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example: {message: Unauthenticated.}
    DisabledAccount:
      description: Cuenta desactivada o estudiante sin perfil activo; se revocan sus tokens
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example: {message: Acceso no autorizado.}
    ValidationError:
      description: Datos inválidos; en login incluye ambos campos de identificación presentes
      content:
        application/json:
          schema:
            type: object
            required: [message, errors]
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: {type: string}
    DatabaseError:
      description: Error de persistencia sin detalles sensibles
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example: {message: No se pudo completar la operación.}
